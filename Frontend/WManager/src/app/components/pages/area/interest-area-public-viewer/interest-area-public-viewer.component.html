<div class="map-container">
  <!-- Pannello laterale (sidebar) -->
  <div id="sidebar" class="sidebar sidebar-left shadow-lg" [ngClass]="{'collapsed': !isPanelVisible}">

    <!-- Tab per riaprire se chiuso -->
    <div class="sidebar-tabs" *ngIf="!isPanelVisible" (click)="togglePanel($event)">
      <ul role="tablist">
        <li class="active text-white bg-primary">
          <span class="sidebar-open-btn">
            <svg class="fa-icon" viewBox="0 0 192 512">
              <path fill="currentColor" d="M0 384.662V127.338c0-17.818 21.543-26.741 34.142-14.142l128.662 128.662c7.81 7.81 7.81 20.474 0 28.284L34.142 398.804C21.543 411.404 0 402.48 0 384.662z"></path>
            </svg>
          </span>
        </li>
      </ul>
    </div>

    <!-- Contenuto della sidebar -->
    <div *ngIf="isPanelVisible" class="sidebar-content bg-dark text-white p-3 shadow">

      <!-- Header della Sidebar -->
      <div class="sidebar-header d-flex justify-content-between align-items-center mb-3">
        <h2 class="h5 mb-0">Control Panel</h2>
        <span class="sidebar-close-btn pointer" (click)="togglePanel($event)">
          <svg class="fa-icon" viewBox="0 0 192 512" style="width: 15px;">
            <path fill="currentColor" d="M192 127.338v257.324c0 17.818-21.543 26.741-34.142 14.142L29.196 270.142c-7.81-7.81-7.81-20.474 0-28.284l128.662-128.662c12.599-12.6 34.142-3.676 34.142 14.142z"></path>
          </svg>
        </span>
      </div>

      <!-- Sezione della legenda -->
      <div class="my-legend mb-4 p-2 rounded bg-secondary-subtle text-dark">
        <div class="legend-title small fw-bold mb-2 text-uppercase text-center border-bottom pb-1">
          {{selectedSensorType}} Color Bar
        </div>
        <div class="legend-scale">
          <ul class="legend-labels d-flex flex-wrap list-unstyled justify-content-center m-0 p-0">
            <li *ngFor="let item of temperatureScale" class="d-flex flex-column align-items-center me-1 mb-1">
              <span class="legend-color-box" [style.background]="item.color" [title]="item.label"></span>
              <span class="small-text">{{ item.label }}</span>
            </li>
          </ul>
        </div>
      </div>

      <!-- Sezione Selezione Modalità -->
      <div class="mode-selector mb-3 border-bottom pb-2">
        <div class="form-check mb-1">
          <input class="form-check-input" type="radio" name="mode" id="rtMode" [(ngModel)]="isRealTime" [value]="true" (ngModelChange)="onLatestIntervalSelect()">
          <label class="form-check-label" for="rtMode">Real-Time</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="mode" id="ltMode" [(ngModel)]="isRealTime" [value]="false" (ngModelChange)="onLatestIntervalSelect()">
          <label class="form-check-label" for="ltMode">Latest Data</label>
        </div>
      </div>

      <!-- Sezione Dati Passati -->
      <div class="data-section mb-4">
        <h6 class="text-primary fw-bold mb-2">
          {{ selectedSensor ? 'Sensor' : 'Area' }} Past Data
        </h6>

        <div class="row g-2 mb-2">
          <div class="col-6">
            <label class="small-text">Start Day</label>
            <input class="form-control form-control-sm" type="date" [(ngModel)]="startDate">
          </div>
          <div class="col-6">
            <label class="small-text">Start Hour</label>
            <input class="form-control form-control-sm" type="time" [(ngModel)]="startHour">
          </div>
        </div>

        <div class="row g-2 mb-2">
          <div class="col-6">
            <label class="small-text">End Day</label>
            <input class="form-control form-control-sm" type="date" [(ngModel)]="endDate">
          </div>
          <div class="col-6">
            <label class="small-text">End Hour</label>
            <input class="form-control form-control-sm" type="time" [(ngModel)]="endHour">
          </div>
        </div>

        <button type="button" class="btn btn-primary btn-sm w-100" (click)="onDateRangeSubmit()">
          Query Historical Data
        </button>
      </div>

      <!-- Sezione Intervalli (Solo se Real-Time) -->
      <div *ngIf="isRealTime" class="interval-section mb-4">
        <label for="latestInterval" class="small-text fw-bold">Observation Interval</label>
        <select id="latestInterval" class="form-select form-select-sm" (change)="onLatestIntervalSelect()">
          <option value="" disabled selected>Select Interval</option>
          <option value="5">5 Minutes</option>
          <option value="10">10 Minutes</option>
          <option value="15">15 Minutes</option>
        </select>
      </div>

      <!-- Sezione Forecast -->
      <div class="forecast-section mb-4">
        <h6 class="text-warning fw-bold mb-2">
          {{ selectedSensor ? 'Sensor' : 'Area' }} Forecast Data
        </h6>
        <label for="forecastInterval" class="small-text">Select Prediction Time</label>
        <select #forecastInterval id="forecastInterval" class="form-select form-select-sm" (change)="onForecastIntervalSelect()">
          <option value="" selected>Select Interval</option>
          <option value="1">+1 Hour</option>
          <option value="12">+12 Hours</option>
          <option value="24">+24 Hours</option>
          <option value="72">+72 Hours</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Barra filtri tipo sensore (Bottom Bar) -->
  <div class="sensor-type-bar px-3 py-2 bg-dark rounded-pill shadow" *ngIf="sensorTypeList && sensorTypeList.length > 0">
    <div class="d-flex gap-2">
      <button *ngFor="let type of sensorTypeList"
              type="button"
              class="btn btn-sm rounded-pill px-3"
              [ngClass]="selectedSensorType === type ? 'btn-success' : 'btn-outline-light'"
              (click)="onSensorTypeSelect(type)">
        {{ type }}
      </button>
    </div>
  </div>

  <!-- Mappa Principale -->
  <div id="map" class="main-map">

    <!-- Lista Sensori Overlay (Top Right) -->
    <div class="sensor-overlay-list p-2 bg-dark-subtle rounded shadow" *ngIf="sensors.length > 0">
      <h6 class="small text-uppercase mb-2 text-center border-bottom pb-1">Sensors</h6>
      <div class="scroll-container">
        <div *ngFor="let sensor of sensors" class="mb-1">
          <button type="button"
                  class="btn btn-xs w-100 text-start text-truncate"
                  [ngClass]="selectedSensor === sensor.id ? 'btn-success' : 'btn-primary'"
                  (click)="onSensorSelect(sensor)"
                  [title]="sensor.companyName">
            {{ sensor.companyName }}
          </button>
        </div>
      </div>
    </div>

    <!-- Informazioni Area (Bottom Right) -->
    <div class="area-info-box p-3 bg-white shadow rounded border" *ngIf="interestArea">
      <h3 class="h5 m-0 text-primary">{{ interestArea.name }}</h3>
      <p class="small text-muted mb-1">{{ interestArea.description }}</p>
      <div class="d-flex align-items-center justify-content-between mt-2">
        <span class="badge bg-secondary">User ID: {{ interestArea.userId }}</span>
        <img class="img-thumbnail mini-thumb" [src]="'assets/default-thumbnail.jpg'" alt="Area thumbnail" />
      </div>
    </div>

  </div>
</div>
