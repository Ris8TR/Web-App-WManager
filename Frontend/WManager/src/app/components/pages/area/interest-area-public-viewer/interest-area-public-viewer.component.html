<div class="map-wrapper">
  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar shadow-lg" [ngClass]="{'collapsed': !isPanelVisible}">

    <button class="sidebar-open-trigger shadow-lg"
            *ngIf="!isPanelVisible"
            (click)="togglePanel($event)"
            title="Open Control Panel">
      <i class="fas fa-sliders-h"></i>
    </button>

    <!-- Contenuto Sidebar -->
    <div *ngIf="isPanelVisible" class="sidebar-inner bg-dark-glass text-white">

      <header class="sidebar-header border-bottom border-secondary mb-3 pb-2 d-flex justify-content-between align-items-center">
        <h5 class="m-0 fw-bold"><i class="fas fa-sliders-h me-2"></i>Control Panel</h5>
        <button class="btn btn-link text-white p-0" (click)="togglePanel($event)">
          <i class="fas fa-times"></i>
        </button>
      </header>

      <!-- Legenda (Semplificata) -->
      <section class="control-section mb-4">
        <div class="section-title text-uppercase small fw-bold text-muted mb-2">{{selectedSensorType}} Scale</div>
        <div class="legend-gradient-container">
          <div class="legend-bar">
            <span *ngFor="let item of temperatureScale"
                  [style.background]="item.color"
                  [title]="item.label"
                  class="color-step"></span>
          </div>
          <div class="d-flex justify-content-between mt-1 px-1">
            <span class="tiny-text">{{temperatureScale[0]!.label}}</span>
            <span class="tiny-text">{{temperatureScale[temperatureScale.length-1]!.label}}</span>
          </div>
        </div>
      </section>

      <!-- Selezione Modalità (Real-Time vs Data) -->
      <section class="control-section mb-4">
        <div class="mode-switch-group bg-dark rounded p-1 d-flex">
          <button class="btn btn-sm flex-fill rounded"
                  [class.btn-primary]="isRealTime" [class.btn-dark]="!isRealTime"
                  (click)="isRealTime = true; onLatestIntervalSelect()">Real-Time</button>
          <button class="btn btn-sm flex-fill rounded"
                  [class.btn-primary]="!isRealTime" [class.btn-dark]="isRealTime"
                  (click)="isRealTime = false; onLatestIntervalSelect()">Latest Data</button>
        </div>
      </section>

      <!-- Intervallo Real-Time (Visibile solo se RT) -->
      <div *ngIf="isRealTime" class="control-section mb-4 animate__animated animate__fadeIn">
        <label class="small fw-bold text-primary mb-1">Update Interval</label>
        <select class="form-select form-select-sm bg-secondary text-white border-0" (change)="onLatestIntervalSelect()">
          <option value="5">Every 5 Minutes</option>
          <option value="10">Every 10 Minutes</option>
          <option value="15">Every 15 Minutes</option>
        </select>
      </div>

      <!-- Query Storica -->
      <section class="control-card bg-black-25 p-3 rounded mb-4">
        <h6 class="text-info small fw-bold text-uppercase mb-3">Historical Query</h6>
        <div class="row g-2 mb-2">
          <div class="col-12"><label class="tiny-text opacity-75">START</label></div>
          <div class="col-7"><input type="date" class="form-control form-control-sm custom-input" [(ngModel)]="startDate"></div>
          <div class="col-5"><input type="time" class="form-control form-control-sm custom-input" [(ngModel)]="startHour"></div>
        </div>
        <div class="row g-2 mb-3">
          <div class="col-12"><label class="tiny-text opacity-75">END</label></div>
          <div class="col-7"><input type="date" class="form-control form-control-sm custom-input" [(ngModel)]="endDate"></div>
          <div class="col-5"><input type="time" class="form-control form-control-sm custom-input" [(ngModel)]="endHour"></div>
        </div>
        <button class="btn btn-info btn-sm w-100 fw-bold" (click)="onDateRangeSubmit()">
          Fetch History
        </button>
      </section>

      <!-- Forecast -->
      <section class="control-card bg-black-25 p-3 rounded">
        <h6 class="text-warning small fw-bold text-uppercase mb-2">Forecast Prediction</h6>
        <select class="form-select form-select-sm bg-secondary text-white border-0" (change)="onForecastIntervalSelect()">
          <option value="">Select forecast window...</option>
          <option value="1">+1 Hour</option>
          <option value="12">+12 Hours</option>
          <option value="24">+24 Hours</option>
        </select>
      </section>

    </div>
  </aside>

  <!-- Mappa -->
  <div id="map" class="main-map">

    <!-- Filtri Sensori (Floating Bottom Bar) -->
    <div class="sensor-dock animate__animated animate__slideInUp">
      <div class="btn-group shadow-lg bg-dark p-1 rounded-pill">
        <button *ngFor="let type of sensorTypeList"
                (click)="onSensorTypeSelect(type)"
                class="btn btn-sm rounded-pill px-4"
                [ngClass]="selectedSensorType === type ? 'btn-success' : 'btn-outline-light border-0'">
          {{ type }}
        </button>
      </div>
    </div>

    <!-- Overlay destra (Sensori e Info) -->
    <div class="right-overlays">
      <div class="card bg-dark-glass text-white shadow-sm sensor-list-card" *ngIf="sensors.length > 0">
        <div class="card-header border-secondary small py-1 px-2 fw-bold">ACTIVE SENSORS</div>
        <div class="list-group list-group-flush overflow-auto" style="max-height: 200px;">
          <button *ngFor="let sensor of sensors"
                  (click)="onSensorSelect(sensor)"
                  class="list-group-item list-group-item-action bg-transparent text-white border-secondary small py-1">
            <i class="fas fa-microchip me-2" [class.text-success]="selectedSensor === sensor.id"></i>
            {{ sensor.companyName }}
          </button>
        </div>
      </div>

      <div class="card area-info-card shadow-lg" *ngIf="interestArea">
        <div class="card-body p-3">
          <h6 class="fw-bold text-primary mb-1">{{ interestArea.name }}</h6>
          <p class="small text-muted m-0">{{ interestArea.description }}</p>
        </div>
      </div>
    </div>

  </div>
</div>
