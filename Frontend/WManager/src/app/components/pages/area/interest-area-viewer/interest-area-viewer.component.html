<div class="dashboard-wrapper">

  <!-- BOTTONE PER RIAPRIRE (visibile se panel chiuso) -->
  <button class="sidebar-open-trigger shadow-lg" *ngIf="!isPanelVisible" (click)="togglePanel($event)">
    <i class="fas fa-sliders-h"></i>
  </button>

  <!-- Sidebar Modernizzata -->
  <aside id="sidebar" class="modern-sidebar" [ngClass]="{'collapsed': !isPanelVisible}">

    <div *ngIf="isPanelVisible" class="sidebar-inner">

      <header class="sidebar-header">
        <span class="fw-bold"><i class="fas fa-chart-line me-2 text-info"></i>Control Panel</span>
        <button class="close-btn" (click)="togglePanel($event)"><i class="fas fa-times"></i></button>
      </header>

      <div class="sidebar-scroll-content">

        <!-- SEZIONE 1: LEGENDA -->
        <section class="sidebar-section">
          <label class="section-label">{{selectedSensorType}} Scale</label>
          <div class="legend-container">
            <div class="legend-bar">
              <span *ngFor="let item of temperatureScale" [style.background]="item.color" [title]="item.label"></span>
            </div>
            <div class="d-flex justify-content-between mt-1 px-1">
              <span class="tiny-text">Low</span>
              <span class="tiny-text">High</span>
            </div>
          </div>
        </section>

        <!-- SEZIONE 2: MODALITÀ (Radio Toggles) -->
        <section class="sidebar-section">
          <label class="section-label">Data Mode</label>
          <div class="mode-switch-group bg-dark-25 rounded p-1 d-flex">
            <button class="btn btn-sm flex-fill rounded"style="color: white"
                    [class.btn-info]="isRealTime" [class.btn-transparent]="!isRealTime"
                    (click)="isRealTime = true; onLatestIntervalSelect()">Real-Time</button>
            <button class="btn btn-sm flex-fill rounded" style="color: white"
                    [class.btn-info]="!isRealTime" [class.btn-transparent]="isRealTime"
                    (click)="isRealTime = false; onLatestIntervalSelect()">Latest</button>
          </div>
        </section>

        <!-- SEZIONE 3: PAST DATA (Solo se loggato e non Real-Time) -->
        <section class="sidebar-section" *ngIf="isObservation && logStringResult !== 'Login'">
          <label class="section-label text-warning">Historical Query</label>
          <div class="historical-card bg-dark-25 p-3 rounded">
            <div class="row g-2 mb-2">
              <div class="col-12"><span class="tiny-label">START</span></div>
              <div class="col-7"><input type="date" class="form-control form-control-sm modern-input" [(ngModel)]="startDate"></div>
              <div class="col-5"><input type="time" class="form-control form-control-sm modern-input" [(ngModel)]="startHour"></div>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-12"><span class="tiny-label">END</span></div>
              <div class="col-7"><input type="date" class="form-control form-control-sm modern-input" [(ngModel)]="endDate"></div>
              <div class="col-5"><input type="time" class="form-control form-control-sm modern-input" [(ngModel)]="endHour"></div>
            </div>
            <button class="btn btn-primary btn-sm w-100 fw-bold" (click)="onDateRangeSubmit()">Fetch History</button>
          </div>
        </section>

        <!-- SEZIONE 4: OBSERVATION INTERVAL (Solo se Real-Time) -->
        <section class="sidebar-section animate-fade-in" *ngIf="isRealTime">
          <label class="section-label">Refresh Every</label>
          <select id="latestInterval" class="modern-select" (change)="onLatestIntervalSelect()">
            <option value="5" selected>5 Minutes</option>
            <option value="10">10 Minutes</option>
            <option value="15">15 Minutes</option>
          </select>
        </section>

        <!-- SEZIONE 5: FORECAST DATA -->
        <section class="sidebar-section" *ngIf="isForecast">
          <label class="section-label text-success">Predictions</label>
          <div class="forecast-card bg-dark-25 p-3 rounded">
            <p class="tiny-text mb-2 text-white-50">Select window for {{ selectedSensor ? 'Sensor' : 'Area' }}</p>
            <select class="modern-select" (change)="onForecastIntervalSelect()">
              <option value="">Select forecast...</option>
              <option value="1">+1 Hour</option>
              <option value="12">+12 Hours</option>
              <option value="24">+24 Hours</option>
              <option value="72">+72 Hours</option>
            </select>
          </div>
        </section>

        <!-- ANALYTICS INTELLIGENCE -->
        <section class="sidebar-section animate-fade-in">
          <label class="section-label text-info">Intelligence Engine</label>
          <div class="analytics-controls bg-dark-25 p-2 rounded">
            <div class="form-check form-switch mb-2">
              <!-- AGGIUNTO (change) -->
              <input class="form-switch input-switch" type="checkbox" id="switchTrend"
                     [(ngModel)]="showTrend" (change)="onTrendToggleChange()">
              <label class="form-check-label tiny-text text-white" for="switchTrend">Show Smooth Trend</label>
            </div>
            <div class="form-check form-switch mb-2">
              <!-- AGGIUNTO (change) -->
              <input class="form-switch input-switch" type="checkbox" id="switchAnomalies"
                     [(ngModel)]="showAnomalies" (change)="onAnomaliesToggleChange()">
              <label class="form-check-label tiny-text text-white" for="switchAnomalies">Highlight Anomalies</label>
            </div>
          </div>
        </section>

      </div>
    </div>
  </aside>

  <!-- MAPPA -->
  <main class="map-container">
    <div id="map">

      <!-- Dock Bottom: Filtri Tipo Sensore -->
      <div class="sensor-dock">
        <div class="btn-group bg-dark-glass p-1 rounded-pill shadow-lg">
          <button *ngFor="let type of sensorTypeList"
                  (click)="onSensorTypeSelect(type)"
                  class="btn btn-sm rounded-pill px-4"
                  [ngClass]="selectedSensorType === type ? 'btn-success' : 'btn-outline-light border-0'">
            {{ type }}
          </button>
        </div>
      </div>

      <!-- Overlay Destra: Lista Sensori Attivi -->
      <div class="sensor-list-overlay" *ngIf="sensors.length > 0">
        <div class="overlay-card bg-dark-glass text-white shadow">
          <header class="p-2 border-bottom border-secondary small fw-bold">ACTIVE SENSORS</header>
          <div class="list-group list-group-flush overflow-auto" style="max-height: 250px;">
            <button *ngFor="let sensor of sensors"
                    (click)="onSensorSelect(sensor)"
                    class="list-group-item list-group-item-action bg-transparent text-white border-secondary small"
                    [class.active-sensor]="selectedSensor === sensor.id">
              {{ sensor.companyName }}
            </button>
          </div>
        </div>
      </div>


      <!-- Overlay Grafico con tasto Espandi -->
      <div class="chart-overlay-container" *ngIf="selectedSensor || isForecast">
        <div class="chart-card bg-dark-glass shadow-lg">
          <div class="chart-header d-flex justify-content-between align-items-center p-2 border-bottom border-secondary">
            <span class="tiny-text fw-bold text-info">TREND PREDICTION</span>
            <div class="d-flex align-items-center gap-2">
              <span class="badge bg-success tiny-text" *ngIf="predictionValue">Next: {{predictionValue | number:'1.1-1'}}</span>
              <button class="btn btn-sm btn-outline-info border-0 p-0" (click)="openChartModal()">
                <i class="fas fa-expand-alt"></i>
              </button>
            </div>
          </div>
          <div class="chart-body p-2">
            <canvas #trendChart id="trendChart" height="150"></canvas>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>
