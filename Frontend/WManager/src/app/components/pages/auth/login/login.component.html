<section class="login-wrapper">
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">

      <div class="col-md-6 col-lg-4">
        <!-- Card stile Dashboard -->
        <div class="login-card shadow-lg animate__animated animate__fadeIn">

          <div class="text-center mb-4">
            <img src="assets/logo.png" alt="Tech4You Logo" class="login-logo mb-2">
            <h4 class="fw-bold text-white">Welcome Back</h4>
            <p class="text-muted small">Please enter your credentials to access the map</p>
          </div>

          <form (ngSubmit)="logInUser()">
            <!-- Email input -->
            <div class="form-group mb-3">
              <label class="form-label-custom" for="email">Email address</label>
              <div class="input-group-custom">
                <i class="fas fa-envelope"></i>
                <input  style="margin-left: 3%" type="email" id="email" class="form-control-custom"
                       placeholder="name@example.com" [(ngModel)]="loginUser.email" name="loginMail"/>
              </div>
            </div>

            <!-- Password input -->
            <div class="form-group mb-3">
              <label class="form-label-custom" for="password">Password</label>
              <div class="input-group-custom">
                <i class="fas fa-lock"></i>
                <input  style="margin-left: 3%" type="password" id="password" class="form-control-custom"
                       placeholder="••••••••" [(ngModel)]="loginUser.password" name="loginPassword" />
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check custom-checkbox">
                <input class="form-check-input" type="checkbox" id="rememberMe"/>
                <label class="form-check-label text-muted small" for="rememberMe">Remember me</label>
              </div>
              <a href="javascript:void(0)" class="forgot-link" (click)="openResetPasswordModal()">Forgot password?</a>
            </div>

            <div class="text-center">
              <button type="submit" class="btn-login-submit w-100 mb-3">
                Login <i class="fas fa-sign-in-alt ms-2"></i>
              </button>
              <p class="text-white-50 small">
                Don't have an account? <a href="signing" class="register-link">Register now</a>
              </p>
            </div>
          </form>

        </div>
      </div>

    </div>
  </div>

  <!-- Footer coerente con la dashboard -->
  <footer class="modern-footer">
    <div class="container-fluid d-flex flex-column flex-md-row justify-content-between align-items-center px-4">
      <div class="text-muted small mb-2 mb-md-0">
        Copyright © 2024 Tech4You. All rights reserved.
      </div>
      <div class="social-links">
        <a href="#"><i class="fab fa-facebook-f"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fab fa-google"></i></a>
        <a href="#"><i class="fab fa-linkedin-in"></i></a>
      </div>
    </div>
  </footer>
</section>
