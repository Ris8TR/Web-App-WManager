<section class="login-wrapper">
  <div class="container py-5">
    <div class="row justify-content-center align-items-center min-vh-100">

      <div class="col-lg-6 col-xl-5">
        <div class="login-card shadow-lg animate-fade-in">

          <div class="text-center mb-4">
            <i class="fas fa-user-plus fa-3x text-primary mb-3"></i>
            <h4 class="fw-bold text-white">Create Account</h4>
            <p class="text-muted small">Join the Tech4You monitoring network</p>
          </div>

          <form id="registrationUser">
            <div class="row">
              <!-- Name -->
              <div class="col-md-6 mb-3">
                <label class="form-label-custom">Name</label>
                <div class="input-group-custom">
                  <i class="fas fa-user"></i>
                  <input style="margin-left: 3%"  type="text" class="form-control-custom" placeholder="John"
                         [(ngModel)]="newUser.firstName" name="registerFirstName" />
                </div>
              </div>

              <!-- Last Name -->
              <div class="col-md-6 mb-3">
                <label class="form-label-custom">Last Name</label>
                <div class="input-group-custom">
                  <i class="fas fa-signature"></i>
                  <input style="margin-left: 3%"  type="text" class="form-control-custom" placeholder="Doe"
                         [(ngModel)]="newUser.lastName" name="registerLastName" />
                </div>
              </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label class="form-label-custom">Email Address</label>
              <div class="input-group-custom">
                <i class="fas fa-envelope"></i>
                <input style="margin-left: 3%"  type="email" class="form-control-custom" placeholder="john.doe@example.com"
                       [(ngModel)]="newUser.email" name="registerMail" />
              </div>
            </div>

            <div class="row">
              <!-- Password -->
              <div class="col-md-6 mb-3">
                <label class="form-label-custom">Password</label>
                <div class="input-group-custom">
                  <i class="fas fa-lock"></i>
                  <input style="margin-left: 3%" type="password" class="form-control-custom" placeholder="••••••••"
                         [(ngModel)]="newUser.password" name="registerPassword" />
                </div>
              </div>

              <!-- Repeat Password -->
              <div class="col-md-6 mb-3">
                <label class="form-label-custom">Repeat Password</label>
                <div class="input-group-custom">
                  <i class="fas fa-shield-alt"></i>
                  <input style="margin-left: 3%" type="password" class="form-control-custom" placeholder="••••••••"
                         [(ngModel)]="passwordCheckUser" name="registerConfirmPassword" />
                </div>
              </div>
            </div>

            <!-- Sensor Password -->
            <div class="mb-4">
              <label class="form-label-custom d-flex justify-content-between">
                Sensor Password
                <span class="text-info" title="Dedicated password for hardware access"><i class="fas fa-info-circle"></i></span>
              </label>
              <div class="input-group-custom">
                <i class="fas fa-microchip"></i>
                <input style="margin-left: 3%" type="password" class="form-control-custom" placeholder="Dedicated sensor password"
                       [(ngModel)]="newUser.sensorPassword" name="registerSensorPassword" />
              </div>
            </div>

            <div class="text-center">
              <button type="button" class="btn-login-submit w-100 mb-3" (click)="userSignIn()">
                Create Account <i class="fas fa-arrow-right ms-2"></i>
              </button>
              <p class="text-white-50 small">
                Already have an account? <a href="login" class="register-link">Log In</a>
              </p>
            </div>
          </form>

        </div>
      </div>

    </div>
  </div>

  <!-- Footer -->
  <footer class="modern-footer">
    <div class="container-fluid d-flex flex-column flex-md-row justify-content-between align-items-center px-4">
      <div class="text-muted small">Copyright © 2024 Tech4You. All rights reserved.</div>
      <div class="social-links d-none d-md-block">
        <a href="#"><i class="fab fa-facebook-f"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fab fa-google"></i></a>
        <a href="#"><i class="fab fa-linkedin-in"></i></a>
      </div>
    </div>
  </footer>
</section>
