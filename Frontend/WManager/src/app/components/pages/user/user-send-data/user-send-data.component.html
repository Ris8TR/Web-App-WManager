<div class="dashboard-wrapper d-flex">
  <!-- Sidebar componente utente (se mantiene lo stile scuro) -->
  <app-user class="sidebar-component"></app-user>

  <main class="content-wrapper flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-10 col-lg-7 col-xl-5">

          <div class="login-card shadow-lg animate-fade-in">

            <div class="text-center mb-4">
              <div class="icon-circle mb-3">
                <i class="fas fa-satellite-dish text-primary"></i>
              </div>
              <h3 class="fw-bold text-white">Upload Observation</h3>
              <p class="text-muted small">Send new sensor data to the platform</p>
            </div>

            <form (ngSubmit)="loadData()">

              <!-- Riga Latitudine e Longitudine -->
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label-custom">Latitude*</label>
                  <div class="input-group-custom">
                    <i class="fas fa-map-marker-alt"></i>
                    <input type="number" step="any" class="form-control-custom"
                           placeholder="0.0000" name="latitude" [(ngModel)]="data.latitude" required />
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="form-label-custom">Longitude*</label>
                  <div class="input-group-custom">
                    <i class="fas fa-map-pin"></i>
                    <input type="number" step="any" class="form-control-custom"
                           placeholder="0.0000" name="longitude" [(ngModel)]="data.longitude" required />
                  </div>
                </div>
              </div>

              <!-- Selezione Sensore -->
              <div class="form-group mb-3">
                <label class="form-label-custom">Target Sensor*</label>
                <div class="input-group-custom">
                  <i class="fas fa-microchip"></i>
                  <select name="sensorId" [(ngModel)]="data.sensorId" class="form-control-custom select-custom">
                    <option [ngValue]="undefined" disabled selected>Select an endpoint...</option>
                    <option *ngFor="let area of endPointsInfo" [value]="area.id">
                      {{area.description}} ({{area.companyName}})
                    </option>
                  </select>
                </div>
              </div>

              <!-- Password Sensore -->
              <div class="form-group mb-3">
                <label class="form-label-custom">Sensor Security Password*</label>
                <div class="input-group-custom">
                  <i class="fas fa-key"></i>
                  <input type="password" class="form-control-custom"
                         placeholder="Enter sensor auth password" name="sensorPassword" [(ngModel)]="data.sensorPassword" required />
                </div>
              </div>

              <!-- Carica File Payload -->
              <div class="form-group mb-4">
                <label class="form-label-custom">Payload File (JSON/CSV)*</label>
                <div class="file-upload-wrapper">
                  <input type="file" id="file" name="file" class="file-input" (change)="caricaFile($event)">
                  <div class="file-dummy">
                    <i class="fas fa-file-code mb-2"></i>
                    <span class="small">Click or drag payload file here</span>
                  </div>
                </div>
              </div>

              <!-- Submit -->
              <div class="text-center">
                <button type="submit" class="btn-login-submit w-100" [disabled]="!formValido()">
                  <i class="fas fa-cloud-upload-alt me-2"></i> Upload Data
                </button>
              </div>

            </form>
          </div>

        </div>
      </div>
    </div>
  </main>
</div>
