<aside class="user-sidebar-container shadow-lg">
  <div class="user-sidebar-inner d-flex flex-column h-100">

    <!-- Header Sidebar -->
    <div class="sidebar-user-header p-4 text-center">
      <div class="brand-icon mb-2">
        <i class="fas fa-user-shield text-info"></i>
      </div>
      <h6 class="text-white fw-bold mb-0 text-uppercase tracking-wider">User Console</h6>
      <hr class="border-secondary opacity-25">
    </div>

    <!-- Navigazione -->
    <nav class="sidebar-nav px-3 flex-grow-1">
      <ul class="nav nav-pills flex-column gap-2">
        <li class="nav-item">
          <a (click)="redirectToUserData()" class="nav-link-custom" active-link>
            <i class="fas fa-id-badge"></i>
            <span>Profile Home</span>
          </a>
        </li>
        <li class="nav-item">
          <a (click)="redirectToUserModify()" class="nav-link-custom">
            <i class="fas fa-user-edit"></i>
            <span>Modify Account</span>
          </a>
        </li>
        <li class="nav-item">
          <a (click)="redirectToUserSendData()" class="nav-link-custom">
            <i class="fas fa-paper-plane"></i>
            <span>Send Sensor Data</span>
          </a>
        </li>
        <li class="nav-item">
          <a (click)="redirectToUserCreateSensor()" class="nav-link-custom">
            <i class="fas fa-plus-square"></i>
            <span>Register Sensor</span>
          </a>
        </li>

        <li class="section-divider mt-3 mb-2">
          <span class="small-label">Monitoring</span>
        </li>

        <li class="nav-item">
          <a (click)="redirectToSensorDataView()" class="nav-link-custom">
            <i class="fas fa-microchip"></i>
            <span>My Sensors</span>
          </a>
        </li>
        <li class="nav-item">
          <a (click)="redirectToInterestAreaDataView()" class="nav-link-custom">
            <i class="fas fa-layer-group"></i>
            <span>Interest Areas</span>
          </a>
        </li>
      </ul>
    </nav>

    <!-- Footer Logout (Opzionale ma consigliato per UX) -->
    <div class="sidebar-footer p-3">
      <button class="btn btn-logout w-100" (click)="logout()">
        <i class="fas fa-power-off me-2"></i>
        <span>Sign Out</span>
      </button>
    </div>

  </div>
</aside>
