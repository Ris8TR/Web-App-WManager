<div class="dashboard-wrapper">

  <!-- BOTTONE PER RIAPRIRE (Sempre presente nel DOM, visibile solo se panel chiuso) -->
  <button class="sidebar-open-trigger shadow-lg"
          *ngIf="!isPanelVisible"
          (click)="togglePanel($event)"
          title="Open Control Panel">
    <i class="fas fa-sliders-h"></i>
  </button>

  <!-- Sidebar -->
  <aside id="sidebar" class="modern-sidebar" [ngClass]="{'collapsed': !isPanelVisible}">

    <div *ngIf="isPanelVisible" class="sidebar-inner">

      <header class="sidebar-header">
        <span class="d-flex align-items-center">
          <i class="fas fa-cog fa-spin me-2 text-primary"></i>
          Control Panel
        </span>
        <button class="close-btn" (click)="togglePanel($event)">
          <i class="fas fa-times"></i>
        </button>
      </header>

      <div class="sidebar-scroll-content">

        <!-- Legenda (Semplificata) -->
        <section class="control-section mb-4">
          <div class="section-title text-uppercase small fw-bold text-muted mb-2">{{selectedSensorType}} Scale</div>
          <div class="legend-gradient-container">
            <div class="legend-bar">
            <span *ngFor="let item of temperatureScale"
                  [style.background]="item.color"
                  [title]="item.label"
                  class="color-step"></span>
            </div>
            <div class="d-flex justify-content-between mt-1 px-1">
              <span class="tiny-text">{{temperatureScale[0]!.label}}</span>
              <span class="tiny-text">{{temperatureScale[temperatureScale.length-1]!.label}}</span>
            </div>
          </div>
        </section>

        <!-- SEZIONE 2: SELEZIONE TIPO SENSORE -->
        <section class="sidebar-section">
          <label class="section-label">Select Sensor</label>
          <div class="sensor-grid">
            <div *ngFor="let sensor of sensorOptions" class="sensor-chip">
              <input type="radio"
                     [id]="'sensor-' + sensor.value"
                     name="sensorType"
                     [value]="sensor.value"
                     [(ngModel)]="selectedSensorType"
                     (click)="onSensorTypeSelect(sensor.value)"> <!-- TRIGGER CAMBIO MAPPA -->
              <label [for]="'sensor-' + sensor.value">{{ sensor.label }}</label>
            </div>
          </div>
        </section>

        <!-- SEZIONE 3: MODALITÀ DATI -->
        <section class="sidebar-section">
          <label class="section-label">Visualization Mode</label>
          <div class="mode-toggle-container">
            <div class="custom-toggle">
              <button [class.active]="isRealTime"
                      (click)="isRealTime = true; onLatestIntervalSelect()">
                Real-Time
              </button>
              <button [class.active]="!isRealTime"
                      (click)="isRealTime = false; onLatestIntervalSelect()">
                Latest
              </button>
            </div>
          </div>

          <!-- Selettore Intervallo -->
          <div *ngIf="isRealTime" class="mt-3 animate-fade-in">
            <label class="small-text text-muted mb-2 d-block">Time Window</label>
            <select class="modern-select"
                    [(ngModel)]="selectedInterval"
                    (change)="onLatestIntervalSelect()"> <!-- TRIGGER AGGIORNAMENTO DATI -->
              <option value="5">Last 5 Minutes</option>
              <option value="10">Last 10 Minutes</option>
              <option value="15">Last 15 Minutes</option>
              <option value="30">Last 30 Minutes</option>
            </select>
          </div>
        </section>



      </div>
    </div>
  </aside>

  <!-- Mappa -->
  <main class="map-container">
    <div id="map"></div>
  </main>
</div>
