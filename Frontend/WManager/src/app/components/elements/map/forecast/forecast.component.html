<div class="dashboard-wrapper">

  <!-- TRIGGER PER APRIRE (Visibile quando la sidebar è chiusa) -->
  <button class="sidebar-open-trigger shadow-lg" *ngIf="!isPanelVisible" (click)="togglePanel($event)">
    <i class="fas fa-sliders-h"></i>
  </button>

  <!-- SIDEBAR MODERNA -->
  <aside id="sidebar" class="modern-sidebar" [ngClass]="{'collapsed': !isPanelVisible}">

    <div *ngIf="isPanelVisible" class="sidebar-inner shadow-2xl">

      <!-- Header Sidebar -->
      <header class="sidebar-header border-bottom border-secondary mb-3 pb-2 d-flex justify-content-between align-items-center">
        <h5 class="m-0 fw-bold"><i class="fas fa-cog me-2 text-primary"></i>Control Panel</h5>
        <button class="btn btn-link text-white p-0" (click)="togglePanel($event)">
          <i class="fas fa-times"></i>
        </button>
      </header>

      <div class="sidebar-scroll-content">

        <!-- SEZIONE 1: LEGENDA (Migliorata) -->
        <section class="sidebar-section mb-4">
          <label class="section-label small-caps mb-2">{{selectedSensorType}} Color Scale</label>
          <div class="legend-glass p-2 rounded">
            <div class="legend-bar">
              <span *ngFor="let item of temperatureScale"
                    [style.background]="item.color"
                    [title]="item.label"
                    class="color-step"></span>
            </div>
            <div class="d-flex justify-content-between mt-1 px-1">
              <span class="tiny-text opacity-75">Min</span>
              <span class="tiny-text opacity-75">Max</span>
            </div>
          </div>
        </section>

        <!-- SEZIONE 2: SELEZIONE TIPO SENSORE (Modern Chips) -->
        <section class="sidebar-section mb-4">
          <label class="section-label small-caps mb-2">Sensor Category</label>
          <div class="sensor-chip-grid">
            <div *ngFor="let sensor of sensorOptions" class="sensor-chip">
              <input type="radio" [id]="'sensor-' + sensor.value" name="sensorType"
                     [value]="sensor.value" [(ngModel)]="selectedSensorType"
                     (change)="onSensorTypeChange($event)">
              <label [for]="'sensor-' + sensor.value" class="chip-label">
                {{ sensor.label }}
              </label>
            </div>
          </div>
        </section>

        <!-- SEZIONE 3: FORECAST (Dropdown Moderno) -->
        <section class="sidebar-section mb-4">
          <label class="section-label small-caps mb-2">Forecast Horizon</label>
          <div class="forecast-container bg-dark-25 p-3 rounded">
            <select id="forecastInterval" class="modern-select" (change)="onForecastIntervalSelect($event)">
              <option value="" selected>Select Time Window...</option>
              <option value="1">+1 Hour</option>
              <option value="2">+2 Hours</option>
              <option value="3">+3 Hours</option>
              <option value="12">+12 Hours</option>
              <option value="24">+24 Hours</option>
              <option value="72">+72 Hours</option>
            </select>
            <p class="mt-2 mb-0 tiny-text text-muted">Updates the map with predicted data.</p>
          </div>
        </section>

      </div>
    </div>
  </aside>

  <!-- CONTENITORE MAPPA -->
  <main class="map-view-container">
    <div id="map" class="full-map"></div>
  </main>
</div>
