version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: postgresql
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DB=postgresql
    restart: unless-stopped
    networks:
      - postgres_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    ports:
      - "8082:80"
    depends_on:
      - postgres
    networks:
      - postgres_network
    environment:
          - PGADMIN_DEFAULT_EMAIL=admin@io.it
          - PGADMIN_DEFAULT_PASSWORD=admin

volumes:
  postgres_data: {}

networks:
  postgres_network:
    name: postgres_network
    driver: bridge